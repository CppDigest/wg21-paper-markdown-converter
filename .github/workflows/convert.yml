name: Convert URLs to Markdown

on:
  workflow_dispatch:
    inputs:
      papers:
        description: 'JSON string: {"papers": ["url1", "url2", ...]}'
        required: true
        type: string
      output_dir:
        description: Output folder name for converted .md files
        required: false
        default: converted
        type: string
      openrouter_model:
        description: OpenRouter vision model used as PDF last-resort fallback
        required: false
        default: openai/gpt-4o
        type: string
      target_repo:
        description: "Destination owner/repo (optional; falls back to secret TARGET_REPO)"
        required: false
        default: ""
        type: string
      target_path:
        description: "Path inside destination repo (optional; falls back to secret TARGET_PATH)"
        required: false
        default: ""
        type: string
      target_branch:
        description: "Branch on destination repo (optional; falls back to secret TARGET_BRANCH or main)"
        required: false
        default: ""
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Writes *.md under output_dir, then output_dir.zip and result.json in the workspace root.
      - name: Convert URLs to Markdown
        id: convert
        run: |
          python url2md.py \
            --papers '${{ inputs.papers }}' \
            --output-dir '${{ inputs.output_dir }}' \
            --model '${{ inputs.openrouter_model }}'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Runs after the step above (even if url2md exits non-zero) so result.json + zip are still uploaded when present.
      - name: Upload zip and result.json (GitHub Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converted-markdown-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.output_dir }}.zip
            result.json
          if-no-files-found: warn
          retention-days: 90

      - name: Push successful outputs to target repository (GitHub API)
        if: always()
        run: python push_via_github_api.py
        env:
          TARGET_REPO: ${{ inputs.target_repo != '' && inputs.target_repo || secrets.TARGET_REPO }}
          TARGET_PATH: ${{ inputs.target_path != '' && inputs.target_path || secrets.TARGET_PATH }}
          TARGET_BRANCH: ${{ inputs.target_branch != '' && inputs.target_branch || secrets.TARGET_BRANCH || 'main' }}
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
          GITHUB_RUN_ID: ${{ github.run_id }}
